<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Myth Atlas — Featured creatures</title>
  <meta name="description" content="Turn a phoenix and a kraken in your hands. An interactive 3D field guide to creatures that never existed.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root {
      --bg:#ebe1cd; --panel:#f8f2e6; --line:#d6c9ae; --ink:#241c14; --muted:#7a6b58;
      --accent:#b4532a; --accent-ink:#ffffff; --accent-tint:#f3dfcd; --chip:#e4d8c2;
      --shadow:70,48,24;
      --serif:"Fraunces","Iowan Old Style",Georgia,serif;
      --sans:"Instrument Sans","Segoe UI",system-ui,sans-serif;
      --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
      --ease:cubic-bezier(.22,.8,.24,1);
    }
    .hero[data-light="dusk"] {
      --bg:#17120d; --panel:#211a13; --line:#3d3225; --ink:#f1e7d6; --muted:#a89880;
      --accent:#e08a4f; --accent-ink:#17120d; --accent-tint:#3b2415; --chip:#2d251b;
      --shadow:0,0,0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
    }
    body {
      background: var(--bg);
      font-family: var(--sans);
      color: var(--ink);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color .6s var(--ease);
    }
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
      padding: 0;
    }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 3px;
    }
    svg {
      display: block;
    }
    .ico {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none;
    }

    /* Layout */
    main.hero#hero {
      position: relative;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-columns: 196px minmax(0, 1fr) clamp(300px, 27vw, 356px);
      overflow: hidden;
      background: var(--bg);
      transition: background-color .6s var(--ease), color .6s var(--ease);
    }

    canvas#gl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    /* 4.1 Sidebar */
    aside.side {
      display: flex;
      flex-direction: column;
      padding: 22px 12px 18px 24px;
      border-right: 1px solid var(--line);
      z-index: 6;
      transition: opacity .5s var(--ease), transform .5s var(--ease);
      min-height: 0;
    }
    .brand {
      font-family: var(--serif);
      font-size: 27px;
      font-weight: 400;
      letter-spacing: -.02em;
      font-variation-settings: "opsz" 48;
      white-space: nowrap;
      line-height: 1;
    }
    .brand small {
      display: block;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }
    ul.nav {
      margin: 20px 0 12px;
      display: grid;
      gap: 2px;
      overflow: hidden;
      list-style: none;
    }
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 7px 10px;
      border-radius: 3px;
      font-size: 14px;
      line-height: 1.15;
      box-shadow: inset 2px 0 0 transparent;
      text-align: left;
      transition: background-color .15s, box-shadow .15s;
    }
    .nav-btn:hover {
      background: var(--chip);
    }
    .nav-btn[aria-current="page"] {
      background: var(--accent-tint);
      box-shadow: inset 2px 0 0 var(--accent);
    }
    .nav-btn .text {
      display: flex;
      flex-direction: column;
    }
    .nav-btn small {
      display: block;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 3px;
      font-weight: 400;
    }

    .feature {
      margin-top: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 3px;
      padding: 14px 14px 16px;
      display: flex;
      flex-direction: column;
    }
    .feature .eyebrow {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }
    #featImg {
      width: 92px;
      height: 76px;
      object-fit: contain;
      margin: 4px auto 2px;
      display: block;
    }
    #featTitle {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -.01em;
    }
    #featText {
      font-size: 12px;
      line-height: 1.4;
      color: var(--muted);
      margin-top: 6px;
    }
    .feature a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--ink);
      text-decoration-color: currentColor;
      text-underline-offset: 3px;
    }

    /* 4.2 Centre */
    section.main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      padding: 48px 18px 14px 26px;
      position: relative;
      min-width: 0;
    }
    .tabs {
      display: flex;
      gap: 10px;
      z-index: 6;
      position: relative;
      transition: opacity .5s var(--ease), transform .5s var(--ease);
    }
    .tab {
      width: 130px;
      padding: 8px 8px 11px;
      display: grid;
      justify-items: center;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 3px;
      position: relative;
      cursor: pointer;
      transition: transform .2s var(--ease), border-color .2s var(--ease);
    }
    .tab::before {
      content: attr(data-no);
      position: absolute;
      left: 8px;
      top: 6px;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--muted);
      letter-spacing: .1em;
    }
    .tab::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transition: transform .35s var(--ease);
      transform-origin: center;
    }
    .tab[aria-selected="true"] {
      border-color: var(--ink);
    }
    .tab[aria-selected="true"]::after {
      transform: scaleX(1);
    }
    .tab:hover {
      transform: translateY(-2px);
      border-color: var(--muted);
    }
    .tab[aria-selected="true"]:hover {
      border-color: var(--ink);
    }
    .tab img {
      width: 58px;
      height: 52px;
      object-fit: contain;
      margin-top: 6px;
      pointer-events: none;
    }
    .tab b {
      font-family: var(--serif);
      font-size: 15.5px;
      font-weight: 500;
      margin-top: 2px;
      letter-spacing: -.01em;
      display: block;
      color: var(--ink);
    }
    .tab i {
      font-family: var(--serif);
      font-style: italic;
      font-size: 12px;
      color: var(--muted);
      display: block;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      user-select: none;
      border-radius: 3px;
      min-height: 0;
      outline: none;
    }
    .stage.dragging {
      cursor: grabbing;
    }

    .plate {
      position: absolute;
      inset: 10px 0 24px;
      z-index: 1;
      pointer-events: none;
    }
    .plate i {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 1px solid var(--line);
    }
    .plate i.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
    .plate i.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
    .plate i.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
    .plate i.br { bottom: 0; right: 0; border-left: none; border-top: none; }

    .ground {
      position: absolute;
      left: 50%;
      bottom: 15%;
      width: min(62%, 460px);
      height: 44px;
      transform: translateX(-50%);
      background: radial-gradient(closest-side, rgba(var(--shadow), .22), rgba(var(--shadow), 0));
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      transition: opacity .5s, transform .7s var(--ease);
    }
    .stage.switching .ground {
      opacity: 0;
      transform: translateX(-50%) scaleX(.4);
    }

    .fallback {
      position: absolute;
      inset: 6% 10% 16%;
      display: none;
      background: center / contain no-repeat;
      z-index: 3;
      pointer-events: none;
    }
    .stage.failed .fallback {
      display: block;
    }

    .loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      transition: opacity .35s var(--ease);
    }
    .loader::before {
      content: '';
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--line);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader.show {
      opacity: 1;
      pointer-events: auto;
    }

    .hint {
      position: absolute;
      right: 4px;
      top: 8px;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--muted);
      pointer-events: none;
      transition: opacity .6s var(--ease);
    }
    .hint svg {
      width: 15px;
      height: 15px;
    }
    .hero.touched .hint {
      opacity: 0;
      pointer-events: none;
    }

    .rail {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      gap: 9px;
      z-index: 6;
    }
    .rail button {
      width: 38px;
      height: 38px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: border-color .2s, transform .1s, background-color .2s, color .2s;
    }
    .rail button svg {
      width: 17px;
      height: 17px;
    }
    .rail button:hover {
      border-color: var(--accent);
    }
    .rail button:active {
      transform: scale(.92);
    }
    .rail button.on {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    .turn {
      position: absolute;
      left: 50%;
      bottom: 46px;
      transform: translateX(-50%);
      z-index: 6;
      display: flex;
      gap: 2px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 3px 4px;
      font-family: var(--mono);
      font-size: 12px;
    }
    .turn button {
      height: 28px;
      min-width: 32px;
      padding: 0 4px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: background-color .15s;
    }
    .turn button:hover {
      background: var(--chip);
    }

    .scale {
      position: absolute;
      left: 0;
      bottom: 30px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .08em;
      z-index: 6;
      pointer-events: none;
    }
    .scale::before {
      content: '';
      display: block;
      width: 72px;
      height: 6px;
      border: 1px solid var(--muted);
      border-top: none;
      margin-bottom: 4px;
    }

    .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(17px, 1.65vw, 22px);
      letter-spacing: -.01em;
      z-index: 6;
      pointer-events: none;
      color: var(--ink);
    }

    /* 4.3 Right */
    section.info {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 16px;
      padding: 13px 26px 14px 0;
      min-height: 0;
      transition: opacity .5s var(--ease), transform .5s var(--ease);
      z-index: 6;
    }
    .top {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .search {
      flex: 1;
      height: 32px;
      padding: 0 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 9px;
      transition: border-color .2s;
    }
    .search:focus-within {
      border-color: var(--accent);
    }
    .search svg {
      width: 15px;
      height: 15px;
      flex: none;
    }
    .search input {
      border: none;
      background: none;
      outline: none;
      font-family: var(--sans);
      font-size: 11.5px;
      color: var(--ink);
      width: 100%;
    }
    .search input::placeholder {
      color: var(--muted);
    }
    .iconbtn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: background-color .15s;
    }
    .iconbtn:hover {
      background: var(--chip);
    }
    .iconbtn svg {
      width: 20px;
      height: 20px;
    }
    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar svg {
      width: 15px;
      height: 15px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 3px;
      box-shadow: inset 0 0 0 4px var(--panel), inset 0 0 0 5px var(--line);
      padding: 26px 24px 20px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      min-height: 0;
    }
    .card::-webkit-scrollbar {
      width: 5px;
    }
    .card::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 3px;
    }

    .detail {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .detail > * {
      animation: rise .6s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 45ms);
    }
    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
    }
    .detail.leaving > * {
      animation: sink .2s ease-in both;
      animation-delay: 0s;
    }
    @keyframes sink {
      to {
        opacity: 0;
        transform: translateY(-6px);
      }
    }

    .detail .eyebrow {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }
    .detail h1 {
      font-family: var(--serif);
      font-size: clamp(42px, 4.4vw, 58px);
      font-weight: 300;
      line-height: .96;
      letter-spacing: -.035em;
      font-variation-settings: "opsz" 144;
      margin-top: 8px;
    }
    .detail h1 em {
      display: block;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 300;
      font-size: .36em;
      letter-spacing: 0;
      color: var(--muted);
      margin-top: 8px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .tags span {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .04em;
      padding: 5px 9px;
      border-radius: 2px;
      border: 1px solid var(--line);
      line-height: 1;
    }
    .detail .lede {
      font-size: 13.5px;
      line-height: 1.55;
      margin-top: 16px;
      text-wrap: pretty;
    }

    /* 4.4 Era timeline */
    .era {
      margin-top: 14px;
    }
    .era .bar {
      position: relative;
      display: grid;
      grid-template-columns: 1300fr 1000fr 400fr;
      height: 6px;
      border-radius: 2px;
      gap: 1px;
      background: var(--panel);
    }
    .era .bar b {
      background: var(--chip);
      height: 100%;
      display: block;
    }
    .era .bar b:first-child {
      border-top-left-radius: 2px;
      border-bottom-left-radius: 2px;
    }
    .era .bar b:last-child {
      border-top-right-radius: 2px;
      border-bottom-right-radius: 2px;
    }
    .era .bar u {
      position: absolute;
      top: -3px;
      height: 12px;
      min-width: 3px;
      background: var(--accent);
      border-radius: 1px;
      text-decoration: none;
      pointer-events: none;
    }
    .era .bar u::after {
      content: attr(data-l);
      position: absolute;
      right: 0;
      top: 15px;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--accent);
      white-space: nowrap;
      letter-spacing: .04em;
    }
    .era .bar u.l::after {
      right: auto;
      left: 0;
    }
    .era .lab {
      display: grid;
      grid-template-columns: 1300fr 1000fr 400fr;
      margin-top: 20px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .detail h2 {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .traits {
      margin-top: 10px;
      display: grid;
      gap: 9px;
    }
    .trait-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 13px;
    }
    .trait-row svg {
      width: 18px;
      height: 18px;
      color: var(--muted);
      flex: none;
      align-self: center;
    }
    .trait-row dt {
      display: flex;
      align-items: baseline;
      color: var(--muted);
      flex: 1;
      margin: 0;
    }
    .trait-row dt::after {
      content: '';
      flex: 1;
      border-bottom: 1px dotted var(--line);
      margin: 0 8px;
      transform: translateY(-3px);
    }
    .trait-row dd {
      text-align: right;
      font-weight: 500;
      margin: 0;
      white-space: nowrap;
    }

    .habitat {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.45;
      align-items: flex-start;
    }
    .habitat svg {
      width: 18px;
      height: 18px;
      color: var(--muted);
      flex: none;
      margin-top: 1px;
    }

    .closeup-wrap {
      margin-top: auto;
      padding-top: 16px;
    }
    button.closeup {
      display: grid;
      grid-template-columns: 76px 1fr 18px;
      gap: 14px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 3px;
      align-items: center;
      text-align: left;
      width: 100%;
      cursor: pointer;
      transition: border-color .2s, background-color .2s;
    }
    .closeup .lens {
      width: 76px;
      height: 76px;
      border-radius: 2px;
      background-color: var(--chip);
      background-size: 520%;
      background-repeat: no-repeat;
      flex: none;
    }
    .closeup-body b {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 400;
      display: block;
      line-height: 1.2;
    }
    .closeup-body small {
      font-size: 11.5px;
      color: var(--muted);
      display: block;
      margin-top: 3px;
      line-height: 1.35;
    }
    .closeup .chev {
      width: 18px;
      height: 18px;
      transition: transform .3s var(--ease);
    }
    button.closeup[aria-pressed="true"] .chev {
      transform: rotate(180deg);
    }
    button.closeup:hover,
    button.closeup[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent-tint);
    }

    /* 4.5 Focus view */
    .hero.focus .side {
      opacity: 0;
      transform: translateX(-24px);

/* Loaders */
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);
gltfLoader.setMeshoptDecoder(MeshoptDecoder);

/* Creature Rigs */
const rigs = DINOS.map(d => {
  const pivot = new THREE.Group();
  const spin = new THREE.Group();
  pivot.add(spin);
  scene.add(pivot);

  const home = new THREE.Quaternion().setFromEuler(
    new THREE.Euler(d.pitch, d.yaw, 0, 'YXZ')
  );
  spin.quaternion.copy(home);
  pivot.visible = false;

  return {
    pivot,
    spin,
    home,
    holder: null,
    model: null,
    loaded: false,
    failed: false,
    promise: null
  };
});

function loadCreature(idx) {
  const rig = rigs[idx];
  if (rig.promise) return rig.promise;

  rig.promise = new Promise(resolve => {
    gltfLoader.load(
      DINOS[idx].model,
      gltf => {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const sphere = box.getBoundingSphere(new THREE.Sphere());
        model.position.sub(sphere.center);

        const holder = new THREE.Group();
        holder.scale.setScalar(1 / sphere.radius);
        holder.add(model);

        model.traverse(node => {
          if (node.isMesh) {
            node.frustumCulled = false;
            if (node.material) {
              node.material.envMapIntensity = 1;
              if (node.material.map) {
                node.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
              }
            }
          }
        });

        rig.holder = holder;
        rig.model = model;
        rig.spin.add(holder);
        rig.loaded = true;
        resolve(rig);
      },
      undefined,
      err => {
        console.error('Failed to load model ' + DINOS[idx].id, err);
        rig.failed = true;
        if (activeIndex === idx) {
          stage.classList.add('failed');
        }
        resolve(rig);
      }
    );
  });

  return rig.promise;
}

/* Camera Placement & Measure */
let firstMeasure = true;
const goal = { cx: 0, cy: 0, px: 1, sw: 100 };
const view = { cx: 0, cy: 0, px: 1, sw: 100 };

function measure() {
  const isFocus = hero.classList.contains('focus');
  const h = hero.getBoundingClientRect();
  const s = isFocus ? h : stage.getBoundingClientRect();
  const W = h.width;
  const H = h.height;
  if (W <= 0 || H <= 0) return;

  goal.cx = s.left - h.left + s.width / 2;
  goal.cy = s.top - h.top + s.height * (isFocus ? 0.5 : 0.44);
  goal.px = Math.min(s.width * 0.5, s.height * 0.6) * 1.16;
  goal.sw = s.width;

  renderer.setSize(W, H, false);
  camera.aspect = W / H;

  if (firstMeasure) {
    view.cx = goal.cx;
    view.cy = goal.cy;
    view.px = goal.px;
    view.sw = goal.sw;
    firstMeasure = false;
  }
}

const ro = new ResizeObserver(() => measure());
ro.observe(hero);
ro.observe(stage);
window.addEventListener('resize', measure);
window.addEventListener('orientationchange', measure);

/* 7. Interaction State & Easing */
let dt = 0.016;
let lastFrameTime = performance.now();
function f(rate) {
  return 1 - Math.exp(-dt * rate);
}
function clamp01(v) {
  return Math.max(0, Math.min(1, v));
}

let activeIndex = 0;
let lastTouch = -10000;
let homing = false;
let yawQueue = 0;
let zoom = 1.0;
let zoomGoal = 1.0;

function touched() {
  lastTouch = performance.now();
  homing = false;
  hero.classList.add('touched');
}

function setZoom(val) {
  zoomGoal = Math.min(3.4, Math.max(0.55, val));
  updateZoomUI();
}

function updateZoomUI() {
  zoomInBtn.classList.toggle('on', zoomGoal >= 1);
  zoomOutBtn.classList.toggle('on', zoomGoal < 1);
  const closeupBtn = document.getElementById('closeup');
  if (closeupBtn) {
    closeupBtn.setAttribute('aria-pressed', zoomGoal > 2.2 ? 'true' : 'false');
  }
}

/* World axis rotation premultiplication */
const _axisY = new THREE.Vector3(0, 1, 0);
const _axisX = new THREE.Vector3(1, 0, 0);
const _qY = new THREE.Quaternion();
const _qX = new THREE.Quaternion();

function turnBy(dyaw, dpitch) {
  _qY.setFromAxisAngle(_axisY, dyaw);
  _qX.setFromAxisAngle(_axisX, dpitch);
  rigs[activeIndex].spin.quaternion.premultiply(_qY).premultiply(_qX);
}

/* Drag & Pointer Interaction */
let isDragging = false;
let lastX = 0;
let lastY = 0;
let velX = 0;
let velY = 0;
const pointers = new Map();
let pinchDist = 0;

stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button, a, input, .rail, .turn')) return;
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1) {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    velX = 0;
    velY = 0;
    yawQueue = 0;
    stage.classList.add('dragging');
    touched();
  } else if (pointers.size === 2) {
    const pts = Array.from(pointers.values());
    pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    isDragging = false;
    stage.classList.remove('dragging');
  }
});

stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1 && isDragging) {
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;

    const k = Math.PI / Math.max(260, view.px * 1.6);
    velX = dx * k;
    velY = dy * k;
    turnBy(velX, velY);
    touched();
  } else if (pointers.size === 2 && pinchDist > 0) {
    const pts = Array.from(pointers.values());
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (dist > 0) {
      const ratio = dist / pinchDist;
      setZoom(zoomGoal * ratio);
      pinchDist = dist;
      touched();
    }
  }
});

function endPointer(e) {
  if (pointers.has(e.pointerId)) {
    pointers.delete(e.pointerId);
  }
  if (pointers.size < 2) pinchDist = 0;
  if (pointers.size === 0) {
    isDragging = false;
    stage.classList.remove('dragging');
  }
}

stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

/* Wheel zoom */
stage.addEventListener('wheel', e => {
  e.preventDefault();
  touched();
  const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016));
  setZoom(zoomGoal * factor);
}, { passive: false });

/* Rail buttons */
zoomInBtn.addEventListener('click', () => {
  touched();
  setZoom(zoomGoal * 1.35);
});
zoomOutBtn.addEventListener('click', () => {
  touched();
  setZoom(zoomGoal / 1.35);
});

/* Expand viewer button */
function toggleExpand() {
  const isFocus = hero.classList.toggle('focus');
  expandBtn.classList.toggle('on', isFocus);
  expandBtn.setAttribute('aria-pressed', isFocus ? 'true' : 'false');
  expandBtn.setAttribute('aria-label', isFocus ? 'Close expanded viewer' : 'Expand viewer');
  measure();
  touched();
}
expandBtn.addEventListener('click', toggleExpand);

/* Light mode button */
function toggleLight() {
  const isDusk = hero.dataset.light === 'dusk';
  const nextMode = isDusk ? 'day' : 'dusk';
  hero.dataset.light = nextMode;
  document.body.style.background = nextMode === 'dusk' ? '#14170f' : '';
  lightBtn.classList.toggle('on', nextMode === 'dusk');
  lightBtn.setAttribute('aria-pressed', nextMode === 'dusk' ? 'true' : 'false');
  lightBtn.setAttribute('aria-label', nextMode === 'dusk' ? 'Switch to daylight' : 'Switch to dusk lighting');
  touched();
}
lightBtn.addEventListener('click', toggleLight);

/* Turn buttons */
turnLBtn.addEventListener('click', () => {
  touched();
  yawQueue -= Math.PI / 2;
});
turnRBtn.addEventListener('click', () => {
  touched();
  yawQueue += Math.PI / 2;
});
turnFullBtn.addEventListener('click', () => {
  touched();
  yawQueue += Math.PI * 2;
});

/* Reset on double-click or key 0 */
function triggerReset() {
  touched();
  homing = true;
  yawQueue = 0;
  velX = 0;
  velY = 0;
  setZoom(1);
}

stage.addEventListener('dblclick', e => {
  if (e.target.closest('button, a, input, .rail, .turn')) return;
  triggerReset();
});

stage.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    touched();
    turnBy(-0.18, 0);
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    touched();
    turnBy(0.18, 0);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    touched();
    turnBy(0, -0.18);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    touched();
    turnBy(0, 0.18);
  } else if (e.key === '+' || e.key === '=') {
    e.preventDefault();
    touched();
    setZoom(zoomGoal * 1.2);
  } else if (e.key === '-') {
    e.preventDefault();
    touched();
    setZoom(zoomGoal / 1.2);
  } else if (e.key === '0') {
    e.preventDefault();
    triggerReset();
  }
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && hero.classList.contains('focus')) {
    toggleExpand();
  }
});

/* 8. Tab Switch & Animations */
function inCubic(t) { return t * t * t; }
function outCubic(t) { return 1 - Math.pow(1 - t, 3); }
function outBack(t) { return 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2); }

let anim = null;
let switchToken = 0;

function renderDetailHTML(d) {
  const eraFrom = d.era[0];
  const eraTo = d.era[1];
  const pctFrom = ((eraFrom + 800) / 2700) * 100;
  const pctTo = ((eraTo + 800) / 2700) * 100;
  const widthPct = Math.max(0.6, pctTo - pctFrom);
  const isLeft = pctFrom < 50;

  const traitsHTML = d.traits.map(([ico, dt, dd]) => `
    <div class="trait-row">
      <svg class="ico"><use href="#${ico}"/></svg>
      <dt>${dt}</dt>
      <dd>${dd}</dd>
    </div>
  `).join('');

  return `
    <div class="eyebrow" style="--i:0">${d.family} · Specimen ${d.no}</div>
    <h1 style="--i:1">${d.name}<em>${d.latin}</em></h1>
    <div class="tags" style="--i:2">${d.tags.map(t => `<span>${t}</span>`).join('')}</div>
    <p class="lede" style="--i:3">${d.lede}</p>
    <div class="era" style="--i:4">
      <div class="bar">
        <b></b>
        <b></b>
        <b></b>
        <u class="${isLeft ? 'l' : ''}" style="left:${pctFrom}%; width:${widthPct}%;" data-l="${d.eraLabel}"></u>
      </div>
      <div class="lab">
        <span>Antiquity</span>
        <span>Medieval</span>
        <span>Modern</span>
      </div>
    </div>
    <h2 style="--i:5">Field notes</h2>
    <dl class="traits" style="--i:6">
      ${traitsHTML}
    </dl>
    <h2 style="--i:7">Haunts</h2>
    <div class="habitat" style="--i:8">
      <svg class="ico"><use href="#t-reed"/></svg>
      <span>${d.habitat}</span>
    </div>
    <div class="closeup-wrap" style="--i:9">
      <button class="closeup" id="closeup" aria-pressed="${zoomGoal > 2.2}" type="button">
        <span class="lens" style="background-image:url('${d.image}'); background-position:${d.lens};"></span>
        <span class="closeup-body">
          <b>Close-up Detail</b>
          <small>${d.closeup}</small>
        </span>
        <svg class="ico chev"><use href="#i-chev"/></svg>
      </button>
    </div>
  `;
}

function fillInfo(i) {
  const d = DINOS[i];
  detail.innerHTML = renderDetailHTML(d);
  captionEl.textContent = d.caption;
  scaleEl.textContent = d.scale;
  featImg.src = d.image;
  featImg.alt = d.name;
  featTitle.textContent = d.feature[0];
  featText.textContent = d.feature[1];
  fallbackEl.style.backgroundImage = `url('${d.image}')`;

  if (rigs[i] && rigs[i].failed) {
    stage.classList.add('failed');
  } else {
    stage.classList.remove('failed');
  }

  const closeupBtn = document.getElementById('closeup');
  if (closeupBtn) {
    closeupBtn.addEventListener('click', () => {
      touched();
      setZoom(zoomGoal > 2.2 ? 1 : 2.6);
    });
  }
}

function paintInfo(i, immediate = false) {
  if (immediate || reducedMotion) {
    fillInfo(i);
    card.scrollTop = 0;
    return;
  }
  detail.classList.add('leaving');
  setTimeout(() => {
    fillInfo(i);
    detail.classList.remove('leaving');
    card.scrollTop = 0;
  }, 200);
}

function updateTabs(i) {
  const tabButtons = tabsEl.querySelectorAll('.tab');
  tabButtons.forEach((tab, idx) => {
    const isSelected = idx === i;
    tab.setAttribute('aria-selected', isSelected ? 'true' : 'false');
    tab.setAttribute('tabindex', isSelected ? '0' : '-1');
  });
}

function select(i) {
  if (i === activeIndex) return;
  const from = activeIndex;
  const dir = Math.sign(i - from);
  activeIndex = i;
  updateTabs(i);
  paintInfo(i);
  stage.classList.add('switching');
  velX = 0;
  velY = 0;
  yawQueue = 0;
  setZoom(1);

  const token = ++switchToken;
  const now = performance.now();
  anim = { from, to: -1, dir, t0: now };

  const targetRig = rigs[i];
  if (!targetRig.loaded && !targetRig.failed) {
    loaderEl.classList.add('show');
  }

  loadCreature(i).then(() => {
    if (switchToken !== token) return;
    loaderEl.classList.remove('show');
    rigs[i].spin.quaternion.copy(rigs[i].home);
    anim.to = i;
    anim.t1 = performance.now();
    stage.classList.remove('switching');
  });
}

/* Tabs creation & keyboard roving tabindex */
tabsEl.innerHTML = DINOS.map((d, idx) => `
  <button class="tab" id="tab-${d.id}" role="tab" data-no="${String(idx + 1).padStart(2, '0')}" aria-controls="detail" aria-selected="${idx === 0}" tabindex="${idx === 0 ? 0 : -1}" type="button">
    <img src="${d.image}" alt="${d.name}" width="58" height="52">
    <b>${d.name}</b>
    <i>${d.latin}</i>
  </button>
`).join('');

tabsEl.addEventListener('click', e => {
  const tabBtn = e.target.closest('.tab');
  if (!tabBtn) return;
  const id = tabBtn.id.replace('tab-', '');
  const idx = DINOS.findIndex(d => d.id === id);
  if (idx !== -1) {
    select(idx);
  }
});

tabsEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    const next = (activeIndex + 1) % DINOS.length;
    select(next);
    const btn = document.getElementById(`tab-${DINOS[next].id}`);
    if (btn) btn.focus();
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = (activeIndex - 1 + DINOS.length) % DINOS.length;
    select(prev);
    const btn = document.getElementById(`tab-${DINOS[prev].id}`);
    if (btn) btn.focus();
  }
});

/* Search input */
const searchInput = document.querySelector('.search input');
if (searchInput) {
  searchInput.addEventListener('input', e => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) return;
    const match = DINOS.findIndex(d =>
      d.name.toLowerCase().includes(q) ||
      d.family.toLowerCase().includes(q) ||
      d.tags.some(t => t.toLowerCase().includes(q)) ||
      d.habitat.toLowerCase().includes(q)
    );
    if (match !== -1 && match !== activeIndex) {
      select(match);
    }
  });
}

/* Sidebar navigation */
const navButtons = document.querySelectorAll('.nav-btn');
navButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    const text = btn.textContent.toLowerCase();
    if (text.includes('fire birds') || text.includes('phoenix')) {
      select(0);
    } else if (text.includes('sea monsters') || text.includes('kraken')) {
      select(1);
    }
  });
});

/* Main animation frame loop */
function loop(now) {
  requestAnimationFrame(loop);

  dt = Math.min(0.05, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  /* View easing toward goal */
  view.cx += (goal.cx - view.cx) * f(7);
  view.cy += (goal.cy - view.cy) * f(7);
  view.px += (goal.px - view.px) * f(7);
  view.sw += (goal.sw - view.sw) * f(7);

  /* Zoom easing */
  zoom += (zoomGoal - zoom) * f(6);

  /* Light preset easing */
  const targetPreset = LIGHT_PRESETS[hero.dataset.light === 'dusk' ? 'dusk' : 'day'];
  curLight.env += (targetPreset.env - curLight.env) * f(4);
  curLight.key += (targetPreset.key - curLight.key) * f(4);
  curLight.rim += (targetPreset.rim - curLight.rim) * f(4);
  curLight.exposure += (targetPreset.exposure - curLight.exposure) * f(4);
  targetKeyColor.setHex(targetPreset.keyColor);
  curKeyColor.lerp(targetKeyColor, f(4));

  scene.environmentIntensity = curLight.env;
  renderer.toneMappingExposure = curLight.exposure;
  key.intensity = curLight.key;
  key.color.copy(curKeyColor);
  rim.intensity = curLight.rim;

  /* Camera positioning & projection offset */
  const W = hero.clientWidth;
  const H = hero.clientHeight;
  if (W > 0 && H > 0) {
    camera.position.z = H / (2 * Math.tan(THREE.MathUtils.degToRad(26 / 2)) * view.px * zoom);
    camera.setViewOffset(W, H, W / 2 - view.cx, H / 2 - view.cy, W, H);
  }

  /* Inertia decay */
  if (!isDragging && (Math.abs(velX) > 1e-5 || Math.abs(velY) > 1e-5)) {
    turnBy(velX, velY);
    const decay = Math.exp(-dt * 4.5);
    velX *= decay;
    velY *= decay;
  }

  /* Yaw queue consumption */
  if (Math.abs(yawQueue) > 1e-5) {
    const step = yawQueue * f(4.2);
    yawQueue -= step;
    turnBy(step, 0);
  }

  /* Homing reset */
  if (homing) {
    const curQ = rigs[activeIndex].spin.quaternion;
    const homeQ = rigs[activeIndex].home;
    curQ.slerp(homeQ, f(6));
    const dot = Math.abs(Math.min(1, Math.max(-1, curQ.dot(homeQ))));
    const angle = 2 * Math.acos(dot);
    if (angle < 0.002) {
      curQ.copy(homeQ);
      homing = false;
    }
  }

  /* Tab switch animation and idle hover / sway */
  const s = now / 1000;
  const idle = reducedMotion ? 0 : clamp01((now - lastTouch - 1800) / 1500);
  const slide = goal.sw * 0.95 / view.px;
  const DUR = reducedMotion ? 1 : 780;

  if (anim) {
    // Outgoing model
    if (anim.from >= 0) {
      const tOut = (now - anim.t0) / (DUR * 0.6);
      if (tOut < 1) {
        const e = inCubic(clamp01(tOut));
        const k = 1 - e;
        const x = -anim.dir * e * slide;
        const twist = -anim.dir * e * 1.4;
        const rigFrom = rigs[anim.from];
        rigFrom.pivot.visible = true;
        rigFrom.pivot.scale.setScalar(k);
        rigFrom.pivot.position.set(x, Math.sin(s * 1.3 + anim.from) * 0.028, 0);
        rigFrom.pivot.rotation.set(Math.sin(s * 0.9) * 0.03 * idle, twist + Math.sin(s * 0.55) * 0.16 * idle, 0);
      } else {
        rigs[anim.from].pivot.visible = false;
      }
    }

    // Incoming model
    if (anim.to >= 0) {
      const tIn = (now - anim.t1) / DUR;
      if (tIn < 1) {
        const e = outCubic(clamp01(tIn));
        const k = Math.max(0.0001, outBack(tIn)) * (0.25 + 0.75 * e);
        const x = anim.dir * (1 - e) * slide;
        const twist = anim.dir * (1 - e) * 1.6;
        const rigTo = rigs[anim.to];
        rigTo.pivot.visible = true;
        rigTo.pivot.scale.setScalar(k);
        rigTo.pivot.position.set(x, Math.sin(s * 1.3 + anim.to) * 0.028, 0);
        rigTo.pivot.rotation.set(Math.sin(s * 0.9) * 0.03 * idle, twist + Math.sin(s * 0.55) * 0.16 * idle, 0);
      } else {
        anim = null;
      }
    }
  }

  if (!anim) {
    rigs.forEach((rig, idx) => {
      if (idx === activeIndex) {
        rig.pivot.visible = true;
        rig.pivot.scale.setScalar(1);
        rig.pivot.position.set(0, Math.sin(s * 1.3 + idx) * 0.028, 0);
        rig.pivot.rotation.set(Math.sin(s * 0.9) * 0.03 * idle, Math.sin(s * 0.55) * 0.16 * idle, 0);
      } else {
        rig.pivot.visible = false;
      }
    });
  }

  renderer.render(scene, camera);
}

/* Boot Sequence */
paintInfo(0, true);
measure();
loaderEl.classList.add('show');
requestAnimationFrame(loop);

loadCreature(0).then(() => {
  loaderEl.classList.remove('show');
  rigs[0].spin.quaternion.copy(rigs[0].home);
  anim = { from: -1, to: 0, dir: 1, t1: performance.now() };
  // warm the other model in background
  loadCreature(1);
});
</script>
</body>
</html>
